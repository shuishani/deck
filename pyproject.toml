[project]
name = "deck"
version = "0.1.0"
description = "个人项目与消息中枢：以项目为中心管理群聊、任务和日志"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
deck = "deck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 前端产物在 .gitignore 里，默认不进包；后台服务装的是包，必须带上。
[tool.hatch.build.targets.wheel]
artifacts = ["src/deck/static"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
